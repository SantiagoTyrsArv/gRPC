# Postgres para desarrollo local (en producción se usa el plugin de Railway)
services:
  postgres:
    image: postgres:17-alpine
    container_name: typerace-postgres
    environment:
      POSTGRES_USER: typerace
      POSTGRES_PASSWORD: typerace
      POSTGRES_DB: typerace
    ports:
      - '5432:5432'
    volumes:
      - typerace-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U typerace']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  typerace-pgdata:
