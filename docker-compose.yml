# Postgres para desarrollo local (en producción se usa Neon)
services:
  postgres:
    image: postgres:17-alpine
    container_name: typerace-postgres
    environment:
      POSTGRES_USER: typerace
      POSTGRES_PASSWORD: typerace
      POSTGRES_DB: typerace
    ports:
      # 5433 en el host para no chocar con un Postgres local instalado en 5432
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - typerace-pgdata:/var/lib/postgresql/data
      # Crea también la base `typerace_test` la primera vez que arranca el contenedor
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U typerace']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  typerace-pgdata:
