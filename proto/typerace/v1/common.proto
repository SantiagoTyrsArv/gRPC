syntax = "proto3";

package typerace.v1;

import "google/protobuf/timestamp.proto";

// Estado de la sala. Máquina de estados:
// WAITING -> COUNTDOWN -> RACING -> FINISHED -> WAITING (revancha).
enum RoomStatus {
  ROOM_STATUS_UNSPECIFIED = 0;
  ROOM_STATUS_WAITING = 1;
  ROOM_STATUS_COUNTDOWN = 2;
  ROOM_STATUS_RACING = 3;
  ROOM_STATUS_FINISHED = 4;
}

// Jugador visible para el resto de la sala (nunca incluye el token).
message Player {
  string id = 1;
  string nickname = 2;
  bool is_host = 3;
  bool is_ready = 4;
  bool is_connected = 5;
}

// Progreso de un jugador durante la carrera, calculado por el servidor.
message PlayerProgress {
  string player_id = 1;
  uint32 typed_chars_correct = 2;
  // Porcentaje completado (0-100).
  double percent = 3;
  double wpm = 4;
  bool finished = 5;
  // Errores acumulados; permite al cliente reanudar tras recargar la página.
  uint32 errors = 6;
}

// Resultado final de un jugador en una carrera.
message PlayerResult {
  string player_id = 1;
  string nickname = 2;
  // Posición final (1 = primero). Quienes no terminan se ordenan después, por avance.
  uint32 position = 3;
  double wpm = 4;
  // Precisión entre 0 y 1.
  double accuracy = 5;
  // Tiempo empleado en milisegundos (0 si no terminó).
  uint32 elapsed_ms = 6;
  bool finished = 7;
}

// Carrera activa o recién terminada dentro de una sala.
message RaceInfo {
  string race_id = 1;
  string text = 2;
  google.protobuf.Timestamp start_at = 3;
  google.protobuf.Timestamp deadline_at = 4;
}

// Estado completo de la sala.
message RoomState {
  string room_code = 1;
  RoomStatus status = 2;
  repeated Player players = 3;
  uint32 max_players = 4;
  // Presente cuando status es COUNTDOWN, RACING o FINISHED.
  RaceInfo race = 5;
  repeated PlayerProgress progress = 6;
  repeated PlayerResult results = 7;
}
